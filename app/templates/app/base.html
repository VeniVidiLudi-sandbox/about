<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}About{% endblock %}</title>
<style>
:root{--fg:#1d1d1f;--bg:#fafafa;--card:#fff;--muted:#6b6b70;--line:#dcdce0;--accent:#3451b2;--chip:#e8ecfb;--warn:#fff4ce}
@media (prefers-color-scheme:dark){:root{--fg:#ececf0;--bg:#16161a;--card:#1f1f25;--muted:#9b9ba3;--line:#34343a;--accent:#8fa6ff;--chip:#2a3050;--warn:#4a3b00}}
*{box-sizing:border-box}
body{font:16px/1.55 system-ui,sans-serif;color:var(--fg);background:var(--bg);margin:0}
.wrap{max-width:64rem;margin:0 auto;padding:1.25rem}
a{color:var(--accent)} .muted{color:var(--muted)}
.banner{background:var(--warn);padding:.4rem .75rem;border-radius:6px}
h1{font-size:2.2rem;margin:.5rem 0 .25rem;letter-spacing:-.02em}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));margin:1.5rem 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1.1rem;display:flex;flex-direction:column;gap:.6rem}
.card h2{margin:0;font-size:1.2rem}
.card h2 a{color:inherit;text-decoration:none}
.card p{margin:0}
.tags{display:flex;flex-wrap:wrap;gap:.35rem}
.tag{background:var(--chip);color:var(--accent);border-radius:999px;padding:.1rem .65rem;font-size:.85rem;text-decoration:none}
.tag.on{background:var(--accent);color:var(--bg)}
.actions{margin-top:auto;display:flex;gap:1rem;font-size:.95rem}
.filters{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin-top:1rem}
img.shot{max-width:100%;border-radius:10px;border:1px solid var(--line)}
footer{margin:2rem 0 1rem;font-size:.85rem}
</style></head><body><div class="wrap">
{% if app_env == "dev" %}<p class="banner">Dev copy</p>{% endif %}
{% block content %}{% endblock %}
<footer class="muted">Version {{ app_version }}</footer>
</div></body></html>
